# Convenience for local self-hosting. `docker compose up --build`, then open
# http://localhost:8787. The server keeps no history of its own — every
# exported card lives only in the visitor's own browser storage.
services:
  social-card-sandbox:
    build: .
    ports:
      # Bound to loopback: the app has no auth by design, so if you're running
      # this on a VPS rather than a laptop, put a reverse proxy (see README ->
      # "Deploying a prebuilt image (VPS)") in front rather than widening this
      # to '8787:8787'/'0.0.0.0:8787:8787' and exposing it to the internet directly.
      - '127.0.0.1:8787:8787'
    restart: unless-stopped
    # Optional: pre-fill the sandbox's branding fields for every visitor.
    # All are optional; a blank or unset variable is simply omitted from the card.
    # environment:
    #   CARD_AUTHOR: 'Your Name'
    #   CARD_WEBSITE: 'example.com'
    #   CARD_SERIES: 'Field Notes'
    #   CARD_MONOGRAM: ''
    #   CARD_FOOTER_MARK: ''
    #   CARD_ISSUE_LABEL: 'Note'
    #   CARD_LINKEDIN: 'linkedin.com/in/you'
    #   CARD_TWITTER: '@you'
