name: One-off version fix

# Temporary, manual-only recovery for two runaway semantic-release runs that
# reset `version` to 1.0.0 and then 1.0.1 (no prior git tag existed for it to
# anchor to, so it treated the project as unreleased both times). Deletes the
# bad v1.0.0/v1.0.1 tags and GitHub Releases, hand-corrects version to 2.1.1,
# and seeds v2.0.0/v2.1.0/v2.1.1 so future semantic-release runs anchor
# correctly. Delete this workflow file once it has run successfully.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Delete the bad v1.0.0/v1.0.1 releases and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.0.0 -y --cleanup-tag || true
          gh release delete v1.0.1 -y --cleanup-tag || true

      - name: Fix CHANGELOG.md
        run: |
          cat <<'SCRIPT' > /tmp/fix-changelog.cjs
          const fs = require('fs');
          let text = fs.readFileSync('CHANGELOG.md', 'utf8');
          const titleIdx = text.indexOf('# Changelog');
          if (titleIdx === -1) throw new Error('CHANGELOG.md missing its title; aborting to avoid corrupting it further');
          text = text.slice(titleIdx);
          const marker = 'the project uses [Semantic Versioning](https://semver.org/).\n\n';
          const pos = text.indexOf(marker);
          if (pos === -1) throw new Error('CHANGELOG.md intro paragraph not found; aborting');
          const insertAt = pos + marker.length;
          const entry = [
            '## [2.1.1] - 2026-09-15',
            '',
            '### Fixed',
            '',
            "- Two consecutive semantic-release runs (see the 2.1.0 entry below) mis-anchored again because the bad `v1.0.0`/`v1.0.1` tags they created were still the highest tags in the repo. Deleted those tags and their GitHub Releases, and hand-corrected `version` to `2.1.1` — `2.1.0` plus the one `fix:` commit since (#7). Seeded `v2.0.0`/`v2.1.0`/`v2.1.1` tags so future runs anchor correctly.",
            '',
            '',
          ].join('\n');
          text = text.slice(0, insertAt) + entry + text.slice(insertAt);
          fs.writeFileSync('CHANGELOG.md', text);
          SCRIPT
          node /tmp/fix-changelog.cjs
          rm /tmp/fix-changelog.cjs

      - name: Set version to 2.1.1
        run: npm version 2.1.1 --no-git-tag-version

      - name: Format
        run: npx prettier --write package.json package-lock.json CHANGELOG.md

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore(release): manually reset version to 2.1.1 after two runaway semantic-release regressions [skip ci]"
          git tag v2.0.0 e2a79ffc0676616da639068acc9696a4007b7b38
          git tag v2.1.0 20ede94e5237d6a989b43a16f6c1989af3f6a8c2
          git tag v2.1.1
          git push origin main
          git push origin v2.0.0 v2.1.0 v2.1.1
