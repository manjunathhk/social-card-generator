name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run test:server
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render
      - name: Render the sample gallery with the compiled CLI
        run: npm run samples -- --built
      - name: Build the browser sandbox
        run: npm run sandbox && cp out/sandbox.html sample/sandbox.html
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-cards
          path: sample/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: social-card-sandbox:ci
          load: true
      - name: Smoke-test the container
        run: |
          docker run -d --name sandbox -p 8787:8787 -e CARD_AUTHOR="CI Author" social-card-sandbox:ci
          for i in $(seq 1 20); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
          curl -sf http://localhost:8787/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/sandbox.html)" = "404"
          curl -sf http://localhost:8787/api/branding | grep -q '"author":"CI Author"'
          docker logs sandbox
          docker rm -f sandbox

  publish:
    name: Publish image to Docker Hub
    needs: [verify, docker]
    # Runs after a verified push to main (or a manual trigger), and only once
    # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN repo secrets exist — see README.md
    # ("Publishing to Docker Hub") for how to set them. Skipped otherwise,
    # rather than failing CI, so forks and un-configured repos stay green.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch') &&
      secrets.DOCKERHUB_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ vars.DOCKERHUB_IMAGE || 'manjunathhk/social-card-generator' }}:latest
            ${{ vars.DOCKERHUB_IMAGE || 'manjunathhk/social-card-generator' }}:${{ github.sha }}
